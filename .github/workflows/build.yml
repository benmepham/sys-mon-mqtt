name: build

# Every push to main rebuilds the binaries on the rolling "latest" release.
# PRs run the same checks and build without publishing.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: shellcheck install.sh
      - name: Build
        run: |
          build() {
            CGO_ENABLED=0 GOOS=linux GOARCH=$1 GOARM=$2 go build -ldflags "-s -w" -o dist/sys-mon-mqtt-linux-$3 .
          }
          build amd64 "" amd64
          build arm64 "" arm64
          build arm 7 armv7
          build arm 6 armv6
      - name: Publish to latest release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag -f latest
          git push -f origin latest
          gh release view latest >/dev/null 2>&1 || gh release create latest --prerelease --title latest --notes "Built from main on every push"
          gh release upload latest dist/* --clobber
